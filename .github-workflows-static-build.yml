# GitHub Actions workflow for building static Nmap binaries
# Save this as .github/workflows/static-build.yml

name: Build Static Nmap Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architectures to build (comma-separated: x86_64,arm64,arm32)'
        required: false
        default: 'x86_64,arm64,arm32'

jobs:
  build-static:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        arch: [x86_64, arm64, arm32]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    
    - name: Build static binary for ${{ matrix.arch }}
      run: |
        # Create a Dockerfile for single architecture build
        cat > Dockerfile.single << 'EOF'
        FROM ubuntu:22.04 as builder
        
        ENV DEBIAN_FRONTEND=noninteractive
        
        RUN apt-get update && apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libpcap-dev \
            libpcre3-dev \
            liblua5.4-dev \
            gcc-multilib \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            libc6-dev-arm64-cross \
            libc6-dev-armhf-cross \
            file \
            && rm -rf /var/lib/apt/lists/*
        
        WORKDIR /nmap-build
        COPY . .
        
        ARG TARGET_ARCH
        RUN chmod +x build-static-cross.sh && \
            ./build-static-cross.sh ${TARGET_ARCH}
        
        FROM scratch as output
        COPY --from=builder /nmap-build/static-binaries/ /
        EOF
        
        # Build for specific architecture
        docker build \
          --build-arg TARGET_ARCH=${{ matrix.arch }} \
          -f Dockerfile.single \
          -t nmap-static-${{ matrix.arch }} .
        
        # Extract binary
        mkdir -p artifacts
        docker create --name temp-container nmap-static-${{ matrix.arch }}
        docker cp temp-container:/nmap-${{ matrix.arch }} artifacts/
        docker rm temp-container
        
        # Verify binary
        file artifacts/nmap-${{ matrix.arch }}
        ls -lh artifacts/nmap-${{ matrix.arch }}
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v3
      with:
        name: nmap-static-${{ matrix.arch }}
        path: artifacts/nmap-${{ matrix.arch }}
        retention-days: 30

  package-release:
    needs: build-static
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts
        
    - name: Create release package
      run: |
        mkdir -p release-package
        
        # Copy binaries
        cp artifacts/nmap-static-x86_64/nmap-x86_64 release-package/
        cp artifacts/nmap-static-arm64/nmap-arm64 release-package/
        cp artifacts/nmap-static-arm32/nmap-arm32 release-package/
        
        # Create README
        cat > release-package/README.txt << 'EOF'
        Nmap Static Binaries
        ===================
        
        This package contains statically compiled Nmap binaries for multiple architectures:
        
        - nmap-x86_64: Intel/AMD 64-bit (x86_64)
        - nmap-arm64:  ARM 64-bit (aarch64)
        - nmap-arm32:  ARM 32-bit (armhf)
        
        All binaries are statically linked and should run on most Linux distributions
        without additional dependencies.
        
        Usage:
        ------
        1. Choose the appropriate binary for your architecture
        2. Make it executable: chmod +x nmap-<arch>
        3. Run: ./nmap-<arch> [options] target
        
        For help: ./nmap-<arch> --help
        
        Note: These binaries may require root privileges for certain scan types.
        
        Build Information:
        -----------------
        Built from: ${{ github.ref }}
        Commit: ${{ github.sha }}
        Build date: $(date -u)
        Builder: GitHub Actions
        EOF
        
        # Create tarball
        cd release-package
        tar -czf ../nmap-static-binaries-${{ github.ref_name }}.tar.gz *
        cd ..
        
        # Create checksums
        sha256sum nmap-static-binaries-${{ github.ref_name }}.tar.gz > checksums.txt
        
        # List contents
        echo "Release package contents:"
        tar -tzf nmap-static-binaries-${{ github.ref_name }}.tar.gz
        
        echo "Package size:"
        ls -lh nmap-static-binaries-${{ github.ref_name }}.tar.gz
        
        echo "Checksums:"
        cat checksums.txt
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          nmap-static-binaries-${{ github.ref_name }}.tar.gz
          checksums.txt
        body: |
          ## Nmap Static Binaries - ${{ github.ref_name }}
          
          This release contains statically compiled Nmap binaries for multiple architectures:
          
          - **nmap-x86_64**: Intel/AMD 64-bit processors
          - **nmap-arm64**: ARM 64-bit processors (Apple M1/M2, AWS Graviton, etc.)
          - **nmap-arm32**: ARM 32-bit processors (Raspberry Pi, embedded systems)
          
          ### Features
          - ✅ Statically linked (no external dependencies)
          - ✅ Full Nmap functionality including NSE
          - ✅ Works on most Linux distributions
          - ❌ OpenSSL disabled for compatibility
          
          ### Usage
          ```bash
          # Download and extract
          tar -xzf nmap-static-binaries-${{ github.ref_name }}.tar.gz
          cd nmap-static-binaries-${{ github.ref_name }}
          
          # Make executable and run
          chmod +x nmap-x86_64
          ./nmap-x86_64 --help
          ```
          
          ### Verification
          Verify the download integrity using the provided checksums:
          ```bash
          sha256sum -c checksums.txt
          ```
          
          Built from commit: ${{ github.sha }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-binaries:
    needs: build-static
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        arch: [x86_64]  # Only test x86_64 on GitHub Actions
    
    steps:
    - name: Download binary artifact
      uses: actions/download-artifact@v3
      with:
        name: nmap-static-${{ matrix.arch }}
        path: artifacts
        
    - name: Test binary
      run: |
        chmod +x artifacts/nmap-${{ matrix.arch }}
        
        # Basic functionality tests
        echo "Testing basic functionality..."
        ./artifacts/nmap-${{ matrix.arch }} --version
        ./artifacts/nmap-${{ matrix.arch }} --help | head -20
        
        # Test that it's statically linked
        echo "Checking static linking..."
        if ldd artifacts/nmap-${{ matrix.arch }} 2>&1 | grep -q "not a dynamic executable"; then
          echo "✅ Binary is statically linked"
        else
          echo "❌ Binary is not statically linked"
          ldd artifacts/nmap-${{ matrix.arch }}
          exit 1
        fi
        
        # Test basic scan (localhost only to avoid network issues)
        echo "Testing basic scan functionality..."
        timeout 30 ./artifacts/nmap-${{ matrix.arch }} -sn 127.0.0.1 || true
        
        echo "✅ All tests passed"